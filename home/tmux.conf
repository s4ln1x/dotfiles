# =============================================================================
# Terminal
# =============================================================================
# Modern terminfo — unlocks italics, better key handling, and truecolor.
# Requires ncurses with tmux-256color (shipped since ~2016, so all modern
# distros and macOS are fine).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -----------------------------------------------------------------------------
# If you ssh to old servers (RHEL 7, ancient CentOS, legacy Unix) and see
# garbled output or "terminal not found" errors, those boxes don't have the
# tmux-256color terminfo entry. DON'T downgrade this config back to
# screen-256color — instead, override TERM per-host in ~/.ssh/config:
#
#     Host old-server legacy-box legacy-*
#       SetEnv TERM=screen-256color
#
# That way local tmux stays modern and only the old hosts see the legacy TERM.
# -----------------------------------------------------------------------------

# =============================================================================
# General
# =============================================================================
set -g status-position top
set -g history-limit 10000
